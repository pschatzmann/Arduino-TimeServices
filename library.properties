name=TimeServices
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=Header-only time server: fuses NTP, GNSS and BLE CTS time and serves it over NTP and BLE, with a Material Design touch GUI.
paragraph=Gathers the time from NTP servers (TinyNTP), a GNSS receiver (NMEA + PPS) and Bluetooth LE Current Time Service peers (TinyCTS), combines it into one clock estimate with outlier rejection, PLL/FLL smoothing and holdover, and publishes it as an NTP server and a BLE Current Time Service peripheral. Arduino port of Android-Time-Services using TinyMaterialDesign.
category=Timing
url=https://github.com/pschatzmann/Arduino-TimeServices
architectures=*
includes=TimeServices.h
depends=TinyMaterialDesign,TinyGPU,TinyNTP,TinyCTS,NimBLE-Arduino
